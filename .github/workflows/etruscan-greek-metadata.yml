name: Reviewed batch download metadata (no model payloads)

on:
  workflow_dispatch:
    inputs:
      leads_file:
        description: 'Exact reviewed expansion candidate file under docs/ingest/'
        required: true
        type: string
      ref:
        description: 'Full commit SHA containing the candidate file and metadata reader'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: expansion-metadata-${{ inputs.leads_file }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            scripts
            src/data
            docs/ingest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read exact authenticated download metadata without fetching payloads
        env:
          LEADS_FILE: ${{ inputs.leads_file }}
          EXACT_REF: ${{ inputs.ref }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { preflightMetadata } from './scripts/prepare-etruscan-greek-20261015.mjs';
          const file = process.env.LEADS_FILE;
          const batches = ['etruscan-greek-20261015', 'beautiful-expansion-20261019'];
          const batch = batches.find(value => file?.startsWith(`docs/ingest/${value}-`));
          if (!batch) throw new Error('Unsupported batch');
          if (!/^[a-f0-9]{40}$/.test(process.env.EXACT_REF || '')) throw new Error('A full exact commit SHA is required');
          if (!/^docs\/ingest\/(?:etruscan-greek-20261015|beautiful-expansion-20261019)-[a-z0-9-]+\.json$/.test(file || '')) throw new Error('Candidate path is outside the reviewed batch');
          const root = fs.realpathSync('docs/ingest'), target = fs.realpathSync(file);
          if (path.dirname(target) !== root || !fs.statSync(target).isFile()) throw new Error('Candidate escaped ingest root');
          const input = JSON.parse(fs.readFileSync(target, 'utf8'));
          if (input.logical_batch_id !== batch) throw new Error('Candidate batch mismatch');
          let result;
          if (input.schema === 'atrium-bounded-institution-inventory-request/1') {
            if (batch !== 'beautiful-expansion-20261019' || input.user !== 'giravolt' || input.max_pages !== 15 || input.count !== 24) throw new Error('Unsupported inventory scope');
            const models = [], seen = new Set();
            const owner = '15422e6e108a4caf9d1b09c6edf49eaa';
            const endpoint = `/v3/users/${owner}/models`;
            let next = `https://api.sketchfab.com${endpoint}?count=24`;
            for (let page = 0; next && page < input.max_pages; page++) {
              if (page) await new Promise(resolve => setTimeout(resolve, 5000));
              const target = new URL(next);
              if (target.origin !== 'https://api.sketchfab.com' || target.pathname.replace(/\/$/, '') !== endpoint) throw new Error('Inventory pagination escaped institution');
              const response = await fetch(target, { headers: { Accept: 'application/json' }, signal: AbortSignal.timeout(60000) });
              if (!response.ok) throw new Error(`Institution inventory HTTP${response.status}; no burst retry`);
              const pageData = await response.json();
              if (!Array.isArray(pageData.results) || pageData.results.length > 24) throw new Error('Invalid bounded inventory page');
              for (const model of pageData.results) {
                if (model.user?.username?.toLowerCase() !== input.user || model.user?.uid !== owner || !/^[a-f0-9]{32}$/.test(model.uid || '') || seen.has(model.uid)) throw new Error('Inventory institution/identity changed');
                seen.add(model.uid); models.push(model);
              }
              next = pageData.next;
            }
            result = { schema: 'atrium-current-institution-inventory/1', batch, generated_at: new Date().toISOString(), user: input.user, count: models.length, complete: true, models };
          } else {
            result = await preflightMetadata([input], { batch, token: process.env.SKETCHFAB_TOKEN });
          }
          fs.mkdirSync(path.join(process.env.RUNNER_TEMP, 'metadata'), { recursive: true });
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'metadata', 'selected-download-metadata.json'), JSON.stringify(result, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          console.log(JSON.stringify({ expected: result.expected, checked: result.checked, complete: result.complete, errors: result.errors }));
          if (!result.complete) process.exitCode = 1;
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: expansion-download-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/metadata/selected-download-metadata.json
          retention-days: 30
          if-no-files-found: warn
