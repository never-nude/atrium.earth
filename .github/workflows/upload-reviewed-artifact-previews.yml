name: Upload reviewed originals from source artifacts
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Exact reviewed artifact preview manifest under docs/ingest/
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/ingest/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact artifacts and reviewed models
        env:
          MANIFEST: ${{ inputs.manifest }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/stage-reviewed-artifact-previews.mjs
      - name: Upload and verify complete public copies
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          node scripts/upload-previews-r2.mjs
          --input=.atrium-ingest/reviewed-preview-upload/slugs.txt
          --previews=.atrium-ingest/reviewed-preview-upload/previews.json
          --previews-dir=.atrium-ingest/reviewed-preview-upload/models
          --report=.atrium-ingest/reviewed-preview-upload/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-preview-upload-${{ github.run_id }}
          path: |
            .atrium-ingest/reviewed-preview-upload/previews.json
            .atrium-ingest/reviewed-preview-upload/report.json
            .atrium-ingest/reviewed-preview-upload/source-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
