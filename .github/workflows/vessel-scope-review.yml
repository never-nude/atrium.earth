name: Etruscan and Greek vessel scope review (images only)

# Dedicated exact marker. This does not activate legacy Africa orientation or
# rerender triggers, mutate the catalog, publish a branch, or upload to R2/Drive.
on:
  push:
    paths:
      - docs/ingest/etruscan-greek-20261015-scope-review-request.json
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact acquired branch/commit containing bound request and renderer'
        required: true
        type: string
      request_file:
        description: 'Exact batch request under docs/ingest/'
        required: true
        default: 'docs/ingest/etruscan-greek-20261015-scope-review-request.json'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: etruscan-greek-vessel-scope-review
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /src/data/
            /public/vendor/
            /public/model-render-utils.js
            /public/__render.html
            /package.json
            /package-lock.json
            /docs/ingest/etruscan-greek-20261015-*
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate exact bound request and optional source artifact references
        id: request
        env:
          REQUEST_FILE: ${{ inputs.request_file || 'docs/ingest/etruscan-greek-20261015-scope-review-request.json' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          for (const required of ['scripts/render-vessel-scope-review.mjs', 'scripts/render-thumbnails.mjs', 'public/__render.html', 'public/model-render-utils.js', 'public/vendor/draco/draco_wasm_wrapper.js', 'public/vendor/draco/draco_decoder.wasm', 'src/data/catalog.json', 'src/data/previews.json', 'src/data/orientations.json', 'src/data/material-appearances.json', 'src/data/appearance-overrides.json', 'package.json', 'package-lock.json']) {
            if (!fs.statSync(required).isFile()) throw new Error('Required production review dependency missing from sparse checkout');
          }
          if (fs.existsSync('public/models')) throw new Error('Unexpected serving model payloads in review sparse checkout');
          const requested = process.env.REQUEST_FILE;
          if (!/^docs\/ingest\/etruscan-greek-20261015-[a-z0-9-]+\.json$/.test(requested)) throw new Error('Request must be an exact batch JSON under docs/ingest');
          const root = fs.realpathSync('docs/ingest'), file = fs.realpathSync(requested);
          if (path.dirname(file) !== root || !fs.statSync(file).isFile()) throw new Error('Request escaped ingest root');
          const request = JSON.parse(fs.readFileSync(file, 'utf8'));
          const artifacts = request.sourceArtifacts || [];
          if (!Array.isArray(artifacts) || artifacts.length > 2) throw new Error('At most two exact source-only Actions artifacts may be supplied');
          for (const [i, artifact] of artifacts.entries()) {
            if (artifact.repository !== 'never-nude/atrium.earth' || !Number.isSafeInteger(artifact.runId) || artifact.runId <= 0 || !Number.isSafeInteger(artifact.artifactId) || artifact.artifactId <= 0 || !/^[a-f0-9]{40}$/.test(artifact.workflowHeadSha || '') || !/^atrium-temporary-sources-etruscan-greek-20261015-[0-9]+-[0-9]+$/.test(artifact.name) || !artifact.name.includes(`-${artifact.runId}-`)) throw new Error('Invalid exact repository/run/artifact binding');
            const response = await fetch(`https://api.github.com/repos/never-nude/atrium.earth/actions/artifacts/${artifact.artifactId}`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }, signal: AbortSignal.timeout(30000) });
            if (!response.ok) throw new Error(`Source artifact metadata HTTP${response.status}`);
            const actual = await response.json();
            if (actual.id !== artifact.artifactId || actual.name !== artifact.name || actual.workflow_run?.id !== artifact.runId || actual.workflow_run?.head_sha !== artifact.workflowHeadSha || actual.expired || !(actual.size_in_bytes > 0)) throw new Error('Source artifact identity/head or availability differs from bound request');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_run_${i + 1}=${artifact.runId}\nsource_id_${i + 1}=${artifact.artifactId}\n`);
          }
          for (const work of request.works || []) {
            if (work.source && !artifacts.some((_a, i) => work.source.path.startsWith(`${i === 0 ? 'one' : 'two'}/`))) throw new Error('Original path must bind to a supplied source artifact prefix one/ or two/');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `request_file=${requested}\n`);
          NODE
          node scripts/render-vessel-scope-review.mjs --request="$REQUEST_FILE" --validate-only
      - name: Install rendering dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Download exact first provider-original artifact to runner only
        if: ${{ steps.request.outputs.source_run_1 != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.request.outputs.source_id_1 }}
          merge-multiple: true
          repository: never-nude/atrium.earth
          run-id: ${{ steps.request.outputs.source_run_1 }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-artifacts/one
      - name: Download exact second provider-original artifact to runner only
        if: ${{ steps.request.outputs.source_run_2 != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.request.outputs.source_id_2 }}
          merge-multiple: true
          repository: never-nude/atrium.earth
          run-id: ${{ steps.request.outputs.source_run_2 }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-artifacts/two
      - name: Render four distinct directions and native/source comparison
        env:
          CHROME_EXTRA_ARGS: '--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader'
        run: |
          node scripts/render-vessel-scope-review.mjs \
            --request="${{ steps.request.outputs.request_file }}" \
            --shards=4 --shard="${{ matrix.shard }}" \
            --source-root="$RUNNER_TEMP/source-artifacts" \
            --work="$RUNNER_TEMP/review-models" \
            --out="$RUNNER_TEMP/scope-review"
      - name: Upload review images and source-bound report only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: etruscan-greek-scope-review-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/scope-review/
          retention-days: 30
          if-no-files-found: warn
