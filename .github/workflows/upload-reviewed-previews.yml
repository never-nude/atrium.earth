name: Upload reviewed preview files to R2

on:
  push:
    branches: [codex/picasso-20261023]
    paths:
      - .github/workflows/upload-reviewed-previews.yml
      - docs/ingest/picasso-20261023-preview-upload.json
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Reviewed preview or Pages copy manifest under docs/ingest/'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    if: ${{ inputs.manifest != 'docs/ingest/2026-11-16-step4-pages-copy.json' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/ingest/
            /src/data/previews.json
            /src/data/physical-dimensions.json
            /src/data/spatial-eligibility.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify reviewed serving files
        env:
          MANIFEST: ${{ inputs.manifest || 'docs/ingest/picasso-20261023-preview-upload.json' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$MANIFEST" == *-repo-preview-transfer.json ]]; then
            node --test scripts/stage-repo-preview-transfer.test.mjs
            node scripts/test-repo-preview-transfer.mjs
            node scripts/stage-repo-preview-transfer.mjs
          elif [[ "$MANIFEST" == *-artifact-preview-upload.json ]]; then
            node scripts/stage-reviewed-artifact-previews.mjs
          else
            node scripts/stage-reviewed-previews.mjs
          fi
      - name: Upload immutable models and verify complete public readbacks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          node scripts/upload-previews-r2.mjs
          --input=.atrium-ingest/reviewed-preview-upload/slugs.txt
          --previews=.atrium-ingest/reviewed-preview-upload/previews.json
          --previews-dir=.atrium-ingest/reviewed-preview-upload/models
          --report=.atrium-ingest/reviewed-preview-upload/report.json
      - name: Verify transferred model delivery and browser access
        if: ${{ endsWith(inputs.manifest, '-repo-preview-transfer.json') }}
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: node scripts/verify-repo-preview-transfer.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reviewed-preview-upload-${{ github.run_id }}
          path: |
            .atrium-ingest/reviewed-preview-upload/previews.json
            .atrium-ingest/reviewed-preview-upload/report.json
            .atrium-ingest/reviewed-preview-upload/source-proof.json
            .atrium-ingest/reviewed-preview-upload/delivery-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  pages-copy:
    if: ${{ inputs.manifest == 'docs/ingest/2026-11-16-step4-pages-copy.json' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/ingest/2026-11-16-step4-pages-copy.json
            /src/data/first-view-models.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm pinned release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=docs/ingest/2026-11-16-step4-pages-copy.json
          run=$(jq -r '.pagesRun' "$manifest")
          commit=$(jq -r '.sourceCommit' "$manifest")
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run" |
            jq -e --arg commit "$commit" '.head_sha == $commit and .head_branch == "main" and .conclusion == "success"'
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: .atrium-ingest/pages-copy
          run-id: ${{ steps.release.outputs.run }}
          github-token: ${{ github.token }}
      - name: Stage eligible assets from Pages
        run: |
          python3 scripts/stage-pages-asset-copy.py \
            .atrium-ingest/pages-copy/artifact.tar docs/ingest/2026-11-16-step4-pages-copy.json \
            src/data/first-view-models.json .atrium-ingest/pages-copy/staged
      - name: Copy objects and verify complete public readbacks
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          node scripts/copy-pages-assets-to-r2.mjs
          .atrium-ingest/pages-copy/staged
          .atrium-ingest/pages-copy/receipt.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pages-copy-receipt
          path: |
            .atrium-ingest/pages-copy/staged/inventory.json
            .atrium-ingest/pages-copy/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
