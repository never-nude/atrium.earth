name: Review museum experience

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experience-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify museum behaviour and source bindings
        run: npm test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Build the complete production package
        run: npm run build
        env:
          SITE: https://atrium.earth
      - name: Verify museum pages in Chromium and WebKit
        run: npm run test:browser
      - name: Report homepage performance
        if: ${{ !cancelled() }}
        run: npm run test:performance
      - name: Upload browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: museum-browser-reports
          path: test-results/
          if-no-files-found: ignore
      - name: Verify hosting budget
        run: node scripts/verify-pages-budget.mjs
      - name: Verify bounded collection delivery
        run: node scripts/check-collection-window.mjs --dist
      - name: Verify published artwork images
        run: node scripts/verify-published-artwork-images.mjs
