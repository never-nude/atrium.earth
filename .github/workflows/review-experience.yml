name: Compare 11 model CDN URLs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/cdn-11-url-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src/lib
            src/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the 11 URLs once
        run: node scripts/cdn-diagnostic.mjs github-actions cdn-diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-diagnostic-evidence
          path: cdn-diagnostic.json
          if-no-files-found: error
