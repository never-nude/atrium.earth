name: Acquire saved leads (review branch)

# Fetches a saved candidate file (docs/ingest/*-leads.json) on GitHub's runners,
# assembles optimized previews and thumbnails, uploads the previews to Cloudflare R2
# (models.atrium.earth), and pushes the catalog changes to a separate review
# branch. It never touches main; the review branch is curated before publishing.

on:
  push:
    branches:
      - claude/atrium-pieces-deploy-4nay07
    paths:
      - .github/workflows/acquire-leads.yml
  workflow_dispatch:
    inputs:
      leads:
        description: 'Candidate file to fetch'
        required: false
        default: 'docs/ingest/african-art-20261002-leads.json'
      batch:
        description: 'Ingest batch ID'
        required: false
        default: 'african-art-20261002-b'

permissions:
  contents: write

concurrency:
  group: acquire-leads
  cancel-in-progress: false

env:
  LEADS: ${{ inputs.leads || 'docs/ingest/african-art-20261002-leads.json' }}
  BATCH: ${{ inputs.batch || 'african-art-20261002-b' }}

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check credentials
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in SKETCHFAB_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "Sketchfab and Cloudflare R2 credentials are available."

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Stage downloads on the larger disk
        run: |
          if sudo mkdir -p /mnt/atrium-ingest 2>/dev/null; then
            sudo chown "$(id -u):$(id -g)" /mnt/atrium-ingest
            ln -s /mnt/atrium-ingest .atrium-ingest
          fi
          df -h / /mnt 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: playwright
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          test -x "$CHROME_PATH" || { echo "Playwright Chromium not found at '$CHROME_PATH'"; exit 1; }
          echo "chrome-path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch source meshes
        run: |
          mkdir -p .atrium-ingest
          npm run ingest:fetch -- --input="$LEADS"
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}

      - name: Assemble catalog pieces
        id: assemble
        run: npm run ingest:assemble -- --batch="$BATCH" --optimize-source-glb
        env:
          PYTHON: python

      - name: Upload previews to Cloudflare R2
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          if [ ! -s .atrium-ingest/new-slugs.txt ]; then
            echo "No accepted new slugs to upload."
            exit 0
          fi
          npm run models:upload-r2 -- --input=.atrium-ingest/new-slugs.txt --report=.atrium-ingest/r2-upload.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Render missing batch thumbnails
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          batch_slugs() {
            node -e '
              const fs = require("fs");
              const wantThumb = process.argv[1];
              for (const work of JSON.parse(fs.readFileSync("src/data/catalog.json", "utf8"))) {
                if (work.ingest_batch !== process.env.BATCH) continue;
                const has = fs.existsSync(`public/previews/renders/${work.slug}/thumb.webp`);
                if (String(has) === wantThumb) console.log(work.slug);
              }' "$1"
          }
          batch_slugs false > .atrium-ingest/render-slugs.txt
          if [ ! -s .atrium-ingest/render-slugs.txt ]; then
            echo "Every batch work already has a thumbnail."
            exit 0
          fi
          echo "Rendering $(wc -l < .atrium-ingest/render-slugs.txt) batch thumbnails."
          npm run models:mirror-r2 -- --input=.atrium-ingest/render-slugs.txt || true
          status=0
          ONLY="$(paste -sd, .atrium-ingest/render-slugs.txt)" npm run images:renders || status=$?
          batch_slugs true > .atrium-ingest/rendered-slugs.txt
          npm run images:mark-renders -- --input=.atrium-ingest/rendered-slugs.txt
          exit $status
        env:
          CHROME_BIN: ${{ steps.playwright.outputs.chrome-path }}
          CHROME_EXTRA_ARGS: '--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader'
          RENDER_TIMEOUT_MS: '180000'

      - name: Verify assets
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: npm run verify:assets 2>&1 | grep -v '│' | tail -40

      - name: Push results to review branch
        if: always() && steps.checkout.outcome == 'success'
        run: |
          out="docs/ingest/${BATCH}-run-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          for f in fetched.json last-report.md last-report.json new-slugs.txt r2-upload.json; do
            [ -f ".atrium-ingest/$f" ] && cp ".atrium-ingest/$f" "$out/" || true
          done
          # Previews normally live on R2; commit a local GLB only if its upload failed.
          if [ -s .atrium-ingest/new-slugs.txt ]; then
            node -e '
              const fs = require("fs");
              const previews = JSON.parse(fs.readFileSync("src/data/previews.json", "utf8"));
              for (const slug of fs.readFileSync(".atrium-ingest/new-slugs.txt", "utf8").split(/\r?\n/).filter(Boolean)) {
                if (previews[slug]?.url === `/models/previews/${slug}/preview.glb`) console.log(slug);
              }' | while read -r slug; do
              glb="public/models/previews/$slug/preview.glb"
              if [ -f "$glb" ] && [ "$(stat -c %s "$glb")" -lt 95000000 ]; then
                git add -f "public/models/previews/$slug"
              elif [ -f "$glb" ]; then
                echo "$slug" >> "$out/too-large-for-git.txt"
              fi
            done
          fi
          # The poster generator rewrites every poster; keep only this batch's.
          node -e '
            const fs = require("fs");
            for (const work of JSON.parse(fs.readFileSync("src/data/catalog.json", "utf8"))) {
              if (work.ingest_batch === process.env.BATCH) console.log(`public/previews/posters/${work.slug}/`);
            }' > "$RUNNER_TEMP/batch-posters.txt"
          git ls-files -m -- public/previews/posters | grep -v -F -f "$RUNNER_TEMP/batch-posters.txt" | xargs -r git checkout --
          git ls-files -o --exclude-standard -- public/previews/posters | grep -v -F -f "$RUNNER_TEMP/batch-posters.txt" | xargs -r rm -f
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Review batch ${BATCH} from ${LEADS} (run ${GITHUB_RUN_ID})" || echo "Nothing to commit."
          git push origin "HEAD:refs/heads/claude/atrium-africa-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
