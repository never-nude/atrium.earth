name: Acquire saved leads (review branch)

# Fetches a saved candidate file (docs/ingest/*-leads.json) on GitHub's runners,
# assembles optimized previews and thumbnails, uploads the previews to Cloudflare R2
# (models.atrium.earth), and pushes the catalog changes to a separate review
# branch. It never touches main; the review branch is curated before publishing.

on:
  workflow_dispatch:
    inputs:
      leads:
        description: 'Candidate file to fetch'
        required: false
        default: 'docs/ingest/african-art-20261002-leads.json'
      batch:
        description: 'Ingest batch ID'
        required: false
        default: 'african-art-20261002-b'

permissions:
  contents: write

concurrency:
  group: acquire-leads
  cancel-in-progress: false

env:
  LEADS: ${{ inputs.leads || 'docs/ingest/african-art-20261002-leads.json' }}
  BATCH: ${{ inputs.batch || 'african-art-20261002-b' }}

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check credentials
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "Cloudflare R2 credentials are available."

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Stage downloads on the larger disk
        run: |
          if sudo mkdir -p /mnt/atrium-ingest 2>/dev/null; then
            sudo chown "$(id -u):$(id -g)" /mnt/atrium-ingest
            ln -s /mnt/atrium-ingest .atrium-ingest
          fi
          df -h / /mnt 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: playwright
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          test -x "$CHROME_PATH" || { echo "Playwright Chromium not found at '$CHROME_PATH'"; exit 1; }
          echo "chrome-path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch source meshes
        run: |
          mkdir -p .atrium-ingest
          # Leave out leads already reviewed and withheld for this batch.
          node -e '
            const fs = require("fs");
            const leads = JSON.parse(fs.readFileSync(process.env.LEADS, "utf8"));
            const rejectedFile = `docs/ingest/${process.env.BATCH}-rejected.json`;
            const holdsFile = `docs/ingest/${process.env.BATCH}-review-holds.json`;
            const rejectedItems = fs.existsSync(rejectedFile) ? JSON.parse(fs.readFileSync(rejectedFile, "utf8")).rejected || [] : [];
            const holdItems = fs.existsSync(holdsFile) ? JSON.parse(fs.readFileSync(holdsFile, "utf8")).holds || [] : [];
            const withheldSlugs = new Set([...rejectedItems, ...holdItems].map((item) => item.slug).filter(Boolean));
            const withheldUids = new Set([...rejectedItems, ...holdItems].map((item) => item.uid).filter(Boolean));
            leads.candidates = leads.candidates.filter((candidate) => !withheldSlugs.has(candidate.slug) && !withheldUids.has(candidate.uid));
            fs.writeFileSync(".atrium-ingest/leads.json", JSON.stringify(leads));
            console.log(`Leads: ${leads.candidates.length} after excluding ${withheldSlugs.size} slug holds and ${withheldUids.size} UID holds.`);'
          npm run ingest:fetch -- --input=.atrium-ingest/leads.json
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}

      - name: Verify strict source batch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const leads = JSON.parse(fs.readFileSync('.atrium-ingest/leads.json', 'utf8'));
          if (!leads.strict_acquisition) {
            console.log('No strict source assertions requested.');
            process.exit(0);
          }
          const fetched = JSON.parse(fs.readFileSync('.atrium-ingest/fetched.json', 'utf8'));
          const expected = leads.candidates || [];
          const actual = fetched.candidates || [];
          const expectedCount = Number(leads.expected_count || expected.length);
          if (expected.length !== expectedCount) throw new Error(`Expected ${expectedCount} lead candidates; found ${expected.length}`);
          if (actual.length !== expectedCount) throw new Error(`Expected ${expectedCount} fetched candidates; found ${actual.length}`);
          if ((fetched.report?.errors || []).length) throw new Error(`Fetch errors: ${JSON.stringify(fetched.report.errors)}`);
          const bySlug = new Map(actual.map((candidate) => [candidate.slug, candidate]));
          const allowedLicenses = new Set(['CC0 1.0', 'Public Domain Mark 1.0', 'CC BY-SA 4.0']);
          for (const candidate of expected) {
            const got = bySlug.get(candidate.slug);
            if (!got) throw new Error(`Missing fetched slug ${candidate.slug}`);
            if (!allowedLicenses.has(candidate.license)) throw new Error(`Unapproved license for ${candidate.slug}: ${candidate.license}`);
            if (!candidate.expected_sha256) throw new Error(`Missing expected_sha256 for ${candidate.slug}`);
            if (got.fetched?.sha256 !== candidate.expected_sha256) {
              throw new Error(`${candidate.slug} SHA-256 ${got.fetched?.sha256} != ${candidate.expected_sha256}`);
            }
            const expectedBytes = Number(candidate.download_size_bytes);
            if (!expectedBytes || Number(got.fetched?.original_download_bytes) !== expectedBytes || Number(got.fetched?.bytes) !== expectedBytes) {
              throw new Error(`${candidate.slug} bytes ${got.fetched?.original_download_bytes}/${got.fetched?.bytes} != ${expectedBytes}`);
            }
          }
          if (bySlug.size !== expectedCount) throw new Error(`Fetched slug set has ${bySlug.size} unique entries; expected ${expectedCount}`);
          console.log(`Verified ${expectedCount} exact source downloads.`);
          NODE

      - name: Assemble catalog pieces
        id: assemble
        run: npm run ingest:assemble -- --batch="$BATCH" --optimize-source-glb
        env:
          PYTHON: python
          ATRIUM_ORIENT_TIMEOUT_MS: '600000'
          ATRIUM_POSE_TIMEOUT: '180'

      - name: Verify strict assembled batch
        if: ${{ !cancelled() && steps.assemble.outcome == 'success' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const leads = JSON.parse(fs.readFileSync('.atrium-ingest/leads.json', 'utf8'));
          if (!leads.strict_acquisition) {
            console.log('No strict assembly assertions requested.');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync('.atrium-ingest/last-report.json', 'utf8'));
          const expected = leads.candidates || [];
          const expectedCount = Number(leads.expected_count || expected.length);
          const expectedSlugs = new Set(expected.map((candidate) => candidate.slug));
          const expectedBySlug = new Map(expected.map((candidate) => [candidate.slug, candidate]));
          const accepted = report.accepted || [];
          const actualSlugs = fs.readFileSync('.atrium-ingest/new-slugs.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          if (accepted.length !== expectedCount || actualSlugs.length !== expectedCount) {
            throw new Error(`Expected ${expectedCount} accepted/new slugs; got ${accepted.length}/${actualSlugs.length}`);
          }
          if ((report.rejected || []).length) throw new Error(`Rejected candidates: ${JSON.stringify(report.rejected)}`);
          for (const slug of actualSlugs) if (!expectedSlugs.has(slug)) throw new Error(`Unexpected assembled slug ${slug}`);
          for (const item of accepted) {
            if (!item.integrity_data || item.integrity_data.skipped) throw new Error(`Missing measured integrity for ${item.slug}`);
            if (Number(item.integrity_data.faces) !== Number(expectedBySlug.get(item.slug)?.face_count)) {
              throw new Error(`Measured source faces differ for ${item.slug}: ${item.integrity_data.faces}`);
            }
          }
          const previews = JSON.parse(fs.readFileSync('src/data/previews.json', 'utf8'));
          for (const candidate of expected) {
            const glb = path.join('public/models/previews', candidate.slug, 'preview.glb');
            const metaFile = path.join('public/models/previews', candidate.slug, 'preview.json');
            if (!fs.existsSync(glb) || !fs.statSync(glb).size) throw new Error(`Missing preview GLB for ${candidate.slug}`);
            if (!fs.existsSync(metaFile)) throw new Error(`Missing preview metadata for ${candidate.slug}`);
            const meta = JSON.parse(fs.readFileSync(metaFile, 'utf8'));
            if (Number(meta.sourceBytes) !== Number(candidate.download_size_bytes)) {
              throw new Error(`${candidate.slug} preview sourceBytes ${meta.sourceBytes} != ${candidate.download_size_bytes}`);
            }
            if (Number(meta.sourceFaces) !== Number(candidate.face_count)) {
              throw new Error(`${candidate.slug} preview sourceFaces ${meta.sourceFaces} != ${candidate.face_count}`);
            }
            if (Number(meta.faces) < 100000 || Number(meta.faces) > Number(leads.expected_preview_faces || 400000)) {
              throw new Error(`Invalid preview face count for ${candidate.slug}: ${meta.faces}`);
            }
            if (previews[candidate.slug]?.url !== `/models/previews/${candidate.slug}/preview.glb`) {
              throw new Error(`Preview manifest is not locally staged for ${candidate.slug}`);
            }
            if (Number(previews[candidate.slug]?.bytes) !== fs.statSync(glb).size || Number(previews[candidate.slug]?.faces) !== Number(meta.faces)) {
              throw new Error(`Preview manifest metadata does not match ${candidate.slug}`);
            }
          }
          console.log(`Verified ${expectedCount} generated previews and integrity reports.`);
          NODE
          while IFS= read -r slug; do
            ./node_modules/.bin/gltf-transform inspect "public/models/previews/$slug/preview.glb" --format csv >/dev/null
          done < .atrium-ingest/new-slugs.txt

      - name: Upload previews to Cloudflare R2
        if: ${{ success() && steps.assemble.outcome == 'success' }}
        run: |
          if [ ! -s .atrium-ingest/new-slugs.txt ]; then
            echo "No accepted new slugs to upload."
            exit 0
          fi
          cp src/data/previews.json .atrium-ingest/candidate-previews.json
          printf '{}\n' > .atrium-ingest/empty-bindings.json
          npm run models:upload-r2 -- \
            --input=.atrium-ingest/new-slugs.txt \
            --previews=.atrium-ingest/candidate-previews.json \
            --physical-dimensions=.atrium-ingest/empty-bindings.json \
            --spatial-eligibility=.atrium-ingest/empty-bindings.json \
            --report=.atrium-ingest/r2-upload.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const wanted = fs.readFileSync('.atrium-ingest/new-slugs.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          const report = JSON.parse(fs.readFileSync('.atrium-ingest/r2-upload.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('.atrium-ingest/candidate-previews.json', 'utf8'));
          const completed = [...(report.uploaded || []), ...(report.unchanged || [])];
          if ((report.failed || []).length || completed.length !== wanted.length) {
            throw new Error(`R2 upload incomplete: ${completed.length}/${wanted.length}; failed=${JSON.stringify(report.failed || [])}`);
          }
          const got = new Map(completed.map((item) => [item.slug, item]));
          for (const slug of wanted) {
            const item = got.get(slug);
            if (!item) throw new Error(`R2 report missing ${slug}`);
            const body = fs.readFileSync(`public/models/previews/${slug}/preview.glb`);
            const digest = crypto.createHash('sha256').update(body).digest('hex');
            if (item.sha256 !== digest || Number(item.bytes) !== body.length) throw new Error(`R2 report differs from local preview for ${slug}`);
            if (item.content_type !== 'model/gltf-binary') throw new Error(`Unexpected R2 content type for ${slug}: ${item.content_type}`);
            if (manifest[slug]?.url !== item.url || Number(manifest[slug]?.bytes) !== body.length || !item.url.endsWith(`/preview-${digest.slice(0, 12)}.glb`)) {
              throw new Error(`Staged R2 manifest mismatch for ${slug}`);
            }
          }
          console.log(`Verified ${completed.length} public R2 previews.`);
          NODE
          mv .atrium-ingest/candidate-previews.json src/data/previews.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Render batch thumbnails and posters
        if: ${{ success() && steps.assemble.outcome == 'success' }}
        run: |
          cp .atrium-ingest/new-slugs.txt .atrium-ingest/render-slugs.txt
          if [ ! -s .atrium-ingest/render-slugs.txt ]; then
            echo "No batch thumbnails to render."
            exit 0
          fi
          while IFS= read -r slug; do
            rm -rf "public/previews/renders/$slug" "public/previews/posters/$slug"
          done < .atrium-ingest/render-slugs.txt
          echo "Rendering $(wc -l < .atrium-ingest/render-slugs.txt) batch thumbnails."
          ONLY="$(paste -sd, .atrium-ingest/render-slugs.txt)" npm run images:renders
          npm run images:mark-renders -- --input=.atrium-ingest/render-slugs.txt
          ONLY="$(paste -sd, .atrium-ingest/render-slugs.txt)" npm run images:posters
          node <<'NODE'
          const fs = require('node:fs');
          const slugs = fs.readFileSync('.atrium-ingest/render-slugs.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          for (const slug of slugs) {
            const thumb = fs.readFileSync(`public/previews/renders/${slug}/thumb.webp`);
            const poster = fs.readFileSync(`public/previews/posters/${slug}/poster.svg`, 'utf8');
            const encoded = poster.match(/href="data:image\/webp;base64,([^"]+)"/)?.[1];
            if (!thumb.length || !encoded || !Buffer.from(encoded, 'base64').equals(thumb)) {
              throw new Error(`${slug}: poster is not derived from the new thumbnail`);
            }
          }
          console.log(`Verified ${slugs.length} thumbnails and posters.`);
          NODE
        env:
          CHROME_BIN: ${{ steps.playwright.outputs.chrome-path }}
          CHROME_EXTRA_ARGS: '--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader'
          RENDER_TIMEOUT_MS: '180000'

      - name: Orientation review sheets
        if: ${{ success() && steps.assemble.outcome == 'success' }}
        run: |
          requests="docs/ingest/${BATCH}-orientation-requests.txt"
          if [ ! -s "$requests" ]; then
            echo "No orientation review requested."
            exit 0
          fi
          npm run models:mirror-r2 -- --input="$requests"
          node scripts/render-orientation-variants.mjs --input="$requests" --out="docs/ingest/${BATCH}-orientation-review"
          for variant in A B C D E F G H I J; do
            while IFS= read -r slug; do
              test -s ".atrium-ingest/orientation-variants/$variant/$slug/thumb.webp" || {
                echo "::error::$slug orientation variant $variant failed"
                exit 1
              }
            done < "$requests"
          done
          while IFS= read -r slug; do
            sheet="${slug//\//__}"
            test -s "docs/ingest/${BATCH}-orientation-review/${sheet}.webp" || {
              echo "::error::$slug orientation sheet missing"
              exit 1
            }
          done < "$requests"
        env:
          CHROME_BIN: ${{ steps.playwright.outputs.chrome-path }}
          CHROME_EXTRA_ARGS: '--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader'
          RENDER_TIMEOUT_MS: '90000'

      - name: Verify assets
        if: ${{ success() && steps.assemble.outcome == 'success' }}
        run: npm run verify:assets

      - name: Push results to review branch
        if: ${{ success() && steps.checkout.outcome == 'success' }}
        run: |
          out="docs/ingest/${BATCH}-run-${GITHUB_RUN_ID}"
          mkdir -p "$out"
          for f in fetched.json last-report.md last-report.json new-slugs.txt r2-upload.json; do
            [ -f ".atrium-ingest/$f" ] && cp ".atrium-ingest/$f" "$out/" || true
          done
          # Sketchfab download URLs are short-lived pre-signed links; keep only their path.
          if [ -f "$out/fetched.json" ]; then
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              for (const candidate of data.candidates || []) {
                if (candidate.fetched?.download_url) candidate.fetched.download_url = candidate.fetched.download_url.replace(/\?.*$/, "");
              }
              fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);' "$out/fetched.json"
          fi
          # Previews normally live on R2; commit a local GLB only if its upload failed.
          if [ -s .atrium-ingest/new-slugs.txt ]; then
            node -e '
              const fs = require("fs");
              const previews = JSON.parse(fs.readFileSync("src/data/previews.json", "utf8"));
              for (const slug of fs.readFileSync(".atrium-ingest/new-slugs.txt", "utf8").split(/\r?\n/).filter(Boolean)) {
                if (previews[slug]?.url === `/models/previews/${slug}/preview.glb`) console.log(slug);
              }' | while read -r slug; do
              glb="public/models/previews/$slug/preview.glb"
              if [ -f "$glb" ] && [ "$(stat -c %s "$glb")" -lt 95000000 ]; then
                git add -f "public/models/previews/$slug"
              elif [ -f "$glb" ]; then
                echo "$slug" >> "$out/too-large-for-git.txt"
              fi
            done
          fi
          # The poster generator rewrites every poster; keep only this batch's.
          node -e '
            const fs = require("fs");
            for (const work of JSON.parse(fs.readFileSync("src/data/catalog.json", "utf8"))) {
              if (work.ingest_batch === process.env.BATCH) console.log(`public/previews/posters/${work.slug}/`);
            }' > "$RUNNER_TEMP/batch-posters.txt"
          git ls-files -m -- public/previews/posters | grep -v -F -f "$RUNNER_TEMP/batch-posters.txt" | xargs -r git checkout --
          git ls-files -o --exclude-standard -- public/previews/posters | grep -v -F -f "$RUNNER_TEMP/batch-posters.txt" | xargs -r rm -f
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Acquisition produced no review changes."
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Review batch ${BATCH} from ${LEADS} (run ${GITHUB_RUN_ID})"
          safe_batch="$(printf '%s' "$BATCH" | tr -cs 'A-Za-z0-9._-' '-')"
          git push origin "HEAD:refs/heads/codex/${safe_batch}-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
