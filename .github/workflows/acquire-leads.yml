name: Acquire saved leads (review branch)

# Fetches a saved candidate file (docs/ingest/*-leads.json) on GitHub's runners,
# assembles previews and thumbnails, and pushes everything to a separate review
# branch. It never touches main; a human/agent curates the review branch first.

on:
  push:
    branches:
      - claude/atrium-pieces-deploy-4nay07
    paths:
      - .github/workflows/acquire-leads.yml
  workflow_dispatch:
    inputs:
      leads:
        description: 'Candidate file to fetch'
        required: false
        default: 'docs/ingest/african-art-20261002-leads.json'
      batch:
        description: 'Ingest batch ID'
        required: false
        default: 'african-art-20261002-b'

permissions:
  contents: write

concurrency:
  group: acquire-leads
  cancel-in-progress: false

env:
  LEADS: ${{ inputs.leads || 'docs/ingest/african-art-20261002-leads.json' }}
  BATCH: ${{ inputs.batch || 'african-art-20261002-b' }}

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Check Sketchfab token
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          if [ -z "$SKETCHFAB_TOKEN" ]; then
            echo "::error::SKETCHFAB_TOKEN repository secret is not set; Sketchfab leads cannot be downloaded."
            exit 1
          fi
          echo "SKETCHFAB_TOKEN is available."

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: playwright
        run: |
          npx playwright install --with-deps chromium
          CHROME_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          test -x "$CHROME_PATH" || { echo "Playwright Chromium not found at '$CHROME_PATH'"; exit 1; }
          echo "chrome-path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch source meshes
        run: |
          mkdir -p .atrium-ingest
          npm run ingest:fetch -- --input="$LEADS"
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}

      - name: Assemble catalog pieces
        run: npm run ingest:assemble -- --batch="$BATCH" --target-faces=200000
        env:
          PYTHON: python

      - name: Render thumbnails
        run: |
          if [ ! -s .atrium-ingest/new-slugs.txt ]; then
            echo "No accepted new slugs to render."
            exit 0
          fi
          ONLY="$(paste -sd, .atrium-ingest/new-slugs.txt)" npm run images:renders
          npm run images:mark-renders -- --input=.atrium-ingest/new-slugs.txt
        env:
          CHROME_BIN: ${{ steps.playwright.outputs.chrome-path }}
          CHROME_EXTRA_ARGS: '--no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader'

      - name: Verify assets
        continue-on-error: true
        run: npm run verify:assets 2>&1 | grep -v '│' | tail -40

      - name: Push results to review branch
        if: always()
        run: |
          out="docs/ingest/${BATCH}-run"
          mkdir -p "$out"
          for f in fetched.json last-report.md last-report.json new-slugs.txt; do
            [ -f ".atrium-ingest/$f" ] && cp ".atrium-ingest/$f" "$out/" || true
          done
          if [ -s .atrium-ingest/new-slugs.txt ]; then
            while read -r slug; do
              [ -n "$slug" ] && [ -d "public/models/previews/$slug" ] && git add -f "public/models/previews/$slug"
            done < .atrium-ingest/new-slugs.txt
          fi
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Review batch ${BATCH} from ${LEADS} (run ${GITHUB_RUN_ID})" || echo "Nothing to commit."
          git push origin "HEAD:refs/heads/claude/atrium-africa-review-${GITHUB_RUN_ID}"
