name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh the daily artwork and weekly museum programme at 09:17 UTC.
    # Static pages keep the same programme throughout each published day.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ATRIUM_RELEASE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    container:
      # Match the Playwright version in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.61.1-resolute@sha256:6b3d024edb132382b0064c4ca56abec52d5df95b93c63dd61a81d3a37abdef7f
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify collection and museum features
        run: npm test

      - name: Build
        run: npm run build
        env:
          SITE: https://atrium.earth

      - name: Verify live model CDN addresses in the built site
        run: node scripts/verify-published-model-delivery.mjs

      - name: Verify live artwork JPEG CDN addresses in the built site
        run: node scripts/verify-published-jpeg-delivery.mjs

      - name: Verify museum pages in Chromium and WebKit
        timeout-minutes: 25
        run: npm run test:browser

      - name: Verify sculpture gestures in Chromium
        run: npm run test:handling-browser

      - name: Verify the world signature in Chromium and WebKit
        run: npm run test:world-browser

      - name: Report homepage performance
        if: ${{ !cancelled() }}
        run: npm run test:performance

      - name: Verify Pages package size
        run: node scripts/verify-pages-budget.mjs

      - name: Verify bounded collection delivery
        run: node scripts/check-collection-window.mjs --dist

      - name: Verify published artwork images
        run: node scripts/verify-published-artwork-images.mjs

      - name: Upload release reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: museum-browser-reports
          path: test-results/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
