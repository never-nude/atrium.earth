name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh the daily artwork and weekly museum programme at 09:17 UTC.
    # Static pages keep the same programme throughout each published day.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Verify collection and museum features
        run: |
          npm run verify:assets
          npm run test:featured
          npm run test:programme
          npm run test:work-titles
          npm run test:wings
          npm run test:additions
          npm run test:world-collection
          npm run test:world-time
          npm run test:world-state
          npm run test:spatial
          npm run test:spatial-museum-bindings

      - name: Build
        run: npm run build
        env:
          SITE: https://atrium.earth

      - name: Verify Pages package size
        run: node scripts/verify-pages-budget.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
