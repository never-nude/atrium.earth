name: Fetch bounded reviewed Sketchfab originals

on:
  push:
    branches: [codex/miro-20261023]
    paths:
      - .github/workflows/fetch-reviewed-sources.yml
      - scripts/fetch-reviewed-sources.mjs
      - docs/ingest/miro-20261023-source-request.json
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Exact reviewed source request under docs/ingest/'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /docs/ingest/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh permissions, authenticated metadata and unchanged originals
        env:
          MANIFEST: ${{ inputs.manifest || 'docs/ingest/miro-20261023-source-request.json' }}
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const manifest = process.env.MANIFEST;
          if (!/^docs\/ingest\/[a-z0-9-]+-source-request\.json$/.test(manifest || '')) throw new Error('Invalid reviewed manifest path');
          const request = JSON.parse(fs.readFileSync(manifest, 'utf8'));
          const script = Array.isArray(request.models) && request.models.length > 3
            ? 'scripts/fetch-reviewed-source-batch.mjs' : 'scripts/fetch-reviewed-sources.mjs';
          const result = spawnSync(process.execPath, [script], {stdio: 'inherit', env: process.env});
          process.exit(result.status ?? 1);
          NODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: reviewed-source-originals-${{ github.run_id }}
          path: .atrium-ingest/reviewed-source-originals/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
